<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PROJECT: NIGHT</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-wrap">
    <canvas id="game" aria-label="Игровое поле"></canvas>
    <header class="hud">
      <div class="brand">PROJECT: <span>NIGHT</span></div>
      <div class="stats">
        <div>ПРЕДОХРАНИТЕЛИ <b id="parts">0 / 3</b></div>
        <div>БАТАРЕЯ <b id="battery">100%</b></div>
      </div>
    </header>
    <div id="message" class="message">НАЙДИ 3 ПРЕДОХРАНИТЕЛЯ И ДОБЕРИСЬ ДО ВЫХОДА</div>
    <div class="controls">
      <div id="stick" class="stick"><div id="knob"></div></div>
      <button id="light" class="action">ФОНАРИК<br><small>ВКЛ / ВЫКЛ</small></button>
    </div>
    <section id="overlay" class="overlay">
      <div class="panel">
        <p class="eyebrow">SURVIVAL HORROR · 2D</p>
        <h1 id="overlay-title">PROJECT:<br><span>NIGHT</span></h1>
        <p id="overlay-text">Ты заперт в заброшенном комплексе. Собери три предохранителя. Не дай ему тебя найти.</p>
        <button id="start">НАЧАТЬ НОЧЬ</button>
        <p class="hint">Совет: двигайся джойстиком. Фонарик помогает видеть, но батарея разряжается.</p>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
